name: iOS

# Builds the iOS app (ios/): the web player (web/app) bundled into a native
# WKWebView shell. Runs a simulator smoke test, then produces an unsigned
# BitChord.ipa to sideload with AltStore / SideStore / Sideloadly.
on:
  push:
    branches: [ios]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the web app
        working-directory: web
        env:
          VITE_PARTY_SERVER_URL: https://api.bitchord.kushagrasingh.in
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @bitchord/app build
          rm -rf ../ios/www
          cp -R app/dist ../ios/www
          du -sh ../ios/www

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BitChord.xcodeproj -scheme BitChord -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -40

      - name: Simulator smoke test
        working-directory: ios
        continue-on-error: true
        run: |
          # idb: real touches in the simulator (taps the mini player like a finger would).
          brew tap facebook/fb >/dev/null && brew install idb-companion >/dev/null || true
          python3 -m pip install --break-system-packages fb-idb >/dev/null 2>&1 || python3 -m pip install fb-idb >/dev/null 2>&1 || true
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/sim -name 'BitChord.app' -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p smoke
          xcrun simctl launch --console-pty "$UDID" com.music.bitchord.ios -route /debug -autotest > smoke/console.log 2>&1 &
          # Wait (up to 90s) for the app's probe to report where the mini player is (CSS px = points).
          XY=""
          for i in $(seq 1 45); do
            XY=$(grep -o '"mini":{"x":[0-9]*,"y":[0-9]*}' smoke/console.log | tail -1 | grep -o '[0-9]\+' | tr '\n' ' ')
            [ -n "$XY" ] && break
            sleep 2
          done
          echo "mini player at: $XY"
          xcrun simctl io "$UDID" screenshot smoke/1-mini.png
          echo "idb: $(command -v idb || echo missing)"
          if [ -n "$XY" ] && command -v idb >/dev/null; then
            idb ui tap --udid "$UDID" $XY 2>&1 && echo "tapped mini player"
            sleep 6; xcrun simctl io "$UDID" screenshot smoke/2-after-tap.png
            # Close, then swipe up on the mini player.
            idb ui tap --udid "$UDID" 30 75 2>&1 && echo "tapped close"
            sleep 3
            set -- $XY
            idb ui swipe --udid "$UDID" "$1" "$2" "$1" $(( $2 - 160 )) --duration 0.25 2>&1 && echo "swiped up"
            sleep 6; xcrun simctl io "$UDID" screenshot smoke/3-after-swipe.png
          else
            echo "no idb or no mini player position"
          fi
          sleep 50
          xcrun simctl launch "$UDID" com.music.bitchord.ios -route /search >/dev/null 2>&1 || true
          sleep 10; xcrun simctl io "$UDID" screenshot smoke/home.png
          grep -E "BitChord\]" smoke/console.log | grep -vE "\[net\]" | head -150 || true
          echo "----- autotest -----"
          grep -E "autotest|translate test|iframe_api test|ProMotion|player failed" smoke/console.log | cut -c1-260 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: ios/smoke
          if-no-files-found: ignore

      - name: Build the unsigned IPA
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BitChord.xcodeproj -scheme BitChord -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          APP=$(find build/device -name 'BitChord.app' -type d -path '*Release-iphoneos*' | head -1)
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry BitChord.ipa Payload
          ls -lh BitChord.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-ipa
          path: ios/BitChord.ipa

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ios-build-${{ github.run_number }}"
          gh release create "$TAG" ios/BitChord.ipa --target "${{ github.sha }}" \
            --title "BitChord iOS (build ${{ github.run_number }})" \
            --notes "Unsigned IPA. Install it with AltStore, SideStore or Sideloadly." --prerelease

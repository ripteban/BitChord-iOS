# XcodeGen spec: `xcodegen generate` (in CI, on macOS) turns this into BitChord.xcodeproj.
name: BitChord
options:
  bundleIdPrefix: com.music.bitchord
  deploymentTarget:
    iOS: "17.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.10"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  BitChord:
    type: application
    platform: iOS
    sources:
      - path: BitChord
      - path: www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.ios
        PRODUCT_NAME: BitChord
        INFOPLIST_FILE: BitChord/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: "NO"
  BitChordUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BitChordUITests
    dependencies:
      - target: BitChord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.music.bitchord.ios.uitests
        TEST_TARGET_NAME: BitChord
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  BitChord:
    build:
      targets:
        BitChord: all
        BitChordUITests: [test]
    test:
      targets:
        - BitChordUITests
